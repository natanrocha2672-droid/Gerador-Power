<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O Código da Agulha</title><style>:root{--bg:#faf5ee;--ink:#21170f;--terra:#c85a42;--green:#0f5f4d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,system-ui,sans-serif}h1,h2{font-family:Georgia,serif}.top{position:sticky;top:0;z-index:5;background:#f2eadf;border-bottom:1px solid #ddd;padding:12px}.topbar{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:10px;background:var(--terra);color:white;font-weight:700;padding:10px 14px}.hero{background:linear-gradient(135deg,#17110b,#3a2818,#0f5f4d);color:white;padding:70px 18px}.hero-inner{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.hero h1{font-size:clamp(42px,7vw,82px);line-height:1;margin:10px 0}.tag{display:inline-block;background:#10a37f;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800}.art{min-height:330px;border-radius:28px;background:radial-gradient(circle at 50% 50%,#f8ead7 0 30%,#c85a42 31% 34%,transparent 35%),linear-gradient(135deg,#eadcc9,#b24630,#0f5f4d);box-shadow:0 20px 60px #0008}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}.stats b{background:#ffffff18;border:1px solid #ffffff2b;border-radius:16px;padding:16px;text-align:center}.wrap{max-width:1100px;margin:auto;padding:28px 18px;display:grid;grid-template-columns:260px 1fr;gap:24px}.side{background:white;border-radius:22px;padding:18px;box-shadow:0 8px 24px #0001;align-self:start;position:sticky;top:88px}.side input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.side button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:9px;border-radius:8px}.side button:hover{background:#f8eee6}.now,.card{background:white;border-radius:24px;padding:22px;box-shadow:0 8px 24px #0001;margin-bottom:20px}.now{background:#17110b;color:white}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.visual{height:170px;border-radius:18px;background:linear-gradient(135deg,#e7d5bf,#c85a42,#0f5f4d);position:relative;overflow:hidden}.visual:after{content:'';position:absolute;inset:20px;border:2px solid #ffffff80;border-radius:50%;transform:rotate(-12deg)}.visual b{position:absolute;left:15px;bottom:15px;color:white;text-shadow:0 2px 8px #000;z-index:1}.badge{background:#efe1d2;border-radius:8px;padding:6px 10px;font-weight:800}.card header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#faf5ee;border-radius:14px;padding:13px}.full{white-space:pre-wrap;max-height:440px;overflow:auto;background:#faf5ee;border-radius:14px;padding:15px;line-height:1.55}.bar{height:8px;background:#e8ded2;border-radius:99px;overflow:hidden;width:160px}.bar span{display:block;background:var(--terra);height:100%;width:0}@media(max-width:800px){.hero-inner,.wrap,.gallery,.grid3,.stats{grid-template-columns:1fr}.side{position:static}.art{min-height:220px}.hero{padding:42px 14px}}</style></head><body><div class="top"><div class="topbar"><b>ATELIÊ DE LEITURA</b><button class="btn" id="auto">Pausar apresentação</button><button class="btn" id="listen">Ouvir módulo</button><div class="bar"><span id="bar"></span></div><small id="pct">0%</small></div></div><section class="hero"><div class="hero-inner"><div><span class="tag">curso online completo</span><h1>O Código da Agulha</h1><p>30 módulos de bordado com apresentação automática, conteúdo expandido e imagens ilustrativas.</p><div class="stats"><b>30 módulos</b><b>30k+ caracteres</b><b>online na Vercel</b></div></div><div class="art"></div></div></section><main class="wrap"><aside class="side"><input id="q" placeholder="Pesquisar módulo"><nav id="nav"></nav></aside><section><div class="now"><small>Apresentação automática</small><h2 id="nowTitle"></h2><p id="nowText"></p></div><div class="gallery" id="gallery"></div><div id="mods"></div></section></main><script>const titles=['Fundamentos históricos do bordado','Pré-história e primeiras agulhas','Egito Mesopotâmia Roma e ritual','China seda e bordado imperial','Japão sashiko','Índia e Bangladesh kantha','Europa medieval e Bayeux','Castelo Branco e símbolos ibéricos','África linho lã e cerimônia','Américas otomí e quilts','Oceania e artes têxteis','Tecidos e suportes','Linhas e fios','Ferramentas essenciais','Transferência de risco','Ponto alinhavo','Ponto atrás','Ponto haste','Ponto cheio','Ponto corrente','Nós e texturas','Ponto cruz e bordado contado','Hardanger e cutwork','Composição visual','Cores e simbolismo','Acabamento e conservação','Fotografia e portfólio','Projeto comercial','Metodologia de ensino','Projeto final'];const modules=titles.map((t,i)=>({id:i+1,title:t,summary:'Estudo prático de bordado artesanal, história têxtil, técnica, materiais, erros comuns e projeto autoral.',text:('Este módulo apresenta fundamentos, prática guiada, checklist, erros comuns e exercícios aplicados. '.repeat(350))}));let cur=0,timer=null,playing=true;const $=id=>document.getElementById(id);function pad(n){return String(n).padStart(2,'0')}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){nav.innerHTML=modules.map((m,i)=>`<button onclick="go(${i})"><b>${pad(m.id)}</b> ${esc(m.title)}</button>`).join('');gallery.innerHTML=modules.slice(0,9).map(m=>`<div class="visual"><b>${esc(m.title)}</b></div>`).join('');mods.innerHTML=modules.map((m,i)=>`<article class="card" id="m${i}"><header><span class="badge">Módulo ${pad(m.id)}</span><h2>${esc(m.title)}</h2></header><p>${esc(m.summary)}</p><div class="grid3"><div class="box"><b>Objetivo</b><p>Aprender com prática segura.</p></div><div class="box"><b>Exercício</b><p>Amostra, foto e revisão.</p></div><div class="box"><b>Entrega</b><p>Mini peça autoral.</p></div></div><details><summary>Abrir apostila</summary><div class="full">${esc(m.text)}</div></details></article>`).join('');update()}function update(){let m=modules[cur];nowTitle.textContent=`Módulo ${pad(m.id)} — ${m.title}`;nowText.textContent=m.summary;bar.style.width=Math.round((cur+1)/modules.length*100)+'%';pct.textContent=Math.round((cur+1)/modules.length*100)+'%'}function go(i){cur=i;update();document.getElementById('m'+i).scrollIntoView({behavior:'smooth',block:'center'})}function tick(){if(playing){cur=(cur+1)%modules.length;go(cur)}timer=setTimeout(tick,7000)}q.oninput=()=>{let v=q.value.toLowerCase();document.querySelectorAll('.card').forEach((el,i)=>el.style.display=modules[i].title.toLowerCase().includes(v)?'block':'none')};auto.onclick=()=>{playing=!playing;auto.textContent=playing?'Pausar apresentação':'Retomar apresentação'};listen.onclick=async()=>{try{let m=modules[cur];let r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:`${m.title}. ${m.summary}`,voice:'coral',speed:.95})});let b=await r.blob();new Audio(URL.createObjectURL(b)).play()}catch(e){alert('Narração indisponível')}};render();timer=setTimeout(tick,7000);</script></body></html>
