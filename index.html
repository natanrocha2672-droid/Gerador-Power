<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>O Código da Agulha — Curso de Bordado</title>
  <meta name="description" content="Curso de bordado com módulos completos extraídos do PDF.">
  <style>
    :root{--bg:#fbf6ee;--paper:#fffaf2;--ink:#25170e;--muted:#715b45;--line:#ead9c2;--accent:#b3543c;--dark:#1d130b}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;line-height:1.65}.hero{background:linear-gradient(135deg,var(--dark),#3c2416);color:white;padding:56px 18px;border-bottom:8px solid var(--accent)}.wrap{max-width:1050px;margin:auto}.badge{display:inline-block;background:#205646;color:white;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}h1{font-family:Georgia,serif;font-size:clamp(2.4rem,10vw,5rem);line-height:1;margin:18px 0}h2{font-family:Georgia,serif;margin:0 0 10px}.hero p{max-width:820px;font-size:1.15rem;color:#f7ead8}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.actions a,.actions button{border:0;border-radius:12px;padding:12px 16px;background:white;color:var(--dark);font-weight:700;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.15)}.layout{max-width:1180px;margin:0 auto;padding:28px 16px;display:grid;grid-template-columns:300px 1fr;gap:24px}.sidebar{align-self:start;position:sticky;top:12px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 30px rgba(40,20,10,.08)}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:1rem;background:white}.count,.status{margin:12px 0;color:var(--muted);font-weight:700}.nav{display:grid;gap:6px;max-height:68vh;overflow:auto}.nav a{display:block;text-decoration:none;color:var(--ink);border-radius:10px;padding:8px 10px;font-size:.95rem}.nav a:hover{background:#f0e2ce}.module{background:white;border:1px solid var(--line);border-radius:24px;padding:22px;margin:0 0 18px;box-shadow:0 12px 30px rgba(40,20,10,.07)}.module-number{display:inline-block;background:#f0e2ce;color:var(--accent);border-radius:10px;padding:6px 10px;font-weight:800;margin-bottom:12px}.summary{color:var(--muted);font-weight:700}.content-text{white-space:pre-wrap;background:#fffaf2;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;max-height:520px;overflow:auto}.image-prompts{background:#fbf6ee;border-left:5px solid var(--accent);padding:12px 14px;border-radius:12px;margin-top:12px}footer{max-width:1180px;margin:20px auto 60px;padding:0 16px;color:var(--muted)}@media(max-width:800px){.layout{display:block}.sidebar{position:static;margin-bottom:20px}h1{font-size:3rem}.content-text{max-height:none}}@media print{.sidebar,.actions{display:none}.layout{display:block}.module{break-inside:avoid}.content-text{max-height:none}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><span class="badge">Curso completo</span><h1>O Código da Agulha</h1><p id="heroDesc">Carregando os 30 módulos completos do curso de bordado.</p><div class="actions"><button type="button" onclick="window.print()">Imprimir / salvar PDF</button><a href="#modulos">Ver módulos</a></div></div></header>
  <main class="layout"><aside class="sidebar"><input id="search" placeholder="Pesquisar módulo, técnica ou termo" aria-label="Pesquisar módulo"><div id="count" class="count">Carregando...</div><nav id="nav" class="nav" aria-label="Lista de módulos"></nav></aside><section id="modulos" class="content"><div id="status" class="status">Carregando módulos completos...</div><div id="modules"></div></section></main>
  <footer><p>O Código da Agulha — curso completo de bordado.</p></footer>
  <script>
    const root=document.getElementById('modules'),count=document.getElementById('count'),search=document.getElementById('search'),nav=document.getElementById('nav'),statusBox=document.getElementById('status'),heroDesc=document.getElementById('heroDesc');let modules=[];
    function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function clean(value,max=500){return String(value||'').replace(/\s+/g,' ').trim().slice(0,max)}
    function imagePromptBlock(content){const idx=String(content||'').search(/Sugestões de Imagens/i);return idx>=0?String(content).slice(idx).trim():''}
    function mainContent(content){const idx=String(content||'').search(/Sugestões de Imagens/i);return idx>=0?String(content).slice(0,idx).trim():String(content||'')}
    function normalizeModule(item){const content=String(item.content||item.conteudo||'');return{id:Number(item.id),title:item.title||item.titulo||`Módulo ${item.id}`,summary:clean(item.summary||item.resumo||content,420),content:mainContent(content),images:imagePromptBlock(content),charCount:Number(item.charCount||content.length||0),source:item.source||''}}
    function markerMatches(raw){const re=/CURSO\s+DE\s+BORDADO\s*[-–—]\s*M[ÓO]DULO\s+(\d+)/gi;return[...String(raw||'').matchAll(re)].map(m=>({id:Number(m[1]),index:m.index}))}
    function headingMatches(raw){const start=Math.max(0,String(raw||'').search(/CURSO\s+DE\s+BORDADO/i));const slice=String(raw||'').slice(start);const re=/(?:^|\n)\s*M[ÓO]DULO\s+(?:[IVXLCDM]+|\d+)\s*:/gi;return[...slice.matchAll(re)].map((m,i)=>({id:i+1,index:start+m.index}))}
    function splitByMarks(raw,marks){return marks.map((mark,index)=>{const id=mark.id||index+1,start=mark.index,end=index+1<marks.length?marks[index+1].index:raw.length,content=raw.slice(start,end).trim(),lines=content.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);let title=(lines.find(line=>/^m[oó]dulo\s+/i.test(line)&&line.length>10)||lines.find(line=>line.length>24&&!/^curso\s+de\s+bordado/i.test(line))||`Módulo ${id}`).replace(/^M[oó]dulo\s+[IVXLCDM\d]+\s*[:\-]?\s*/i,'').trim();let summary=clean(lines.filter(line=>!/^curso/i.test(line)&&!/^m[oó]dulo/i.test(line)&&!/^[0-9]+\./.test(line)&&!/^[-—]{3,}$/.test(line)).slice(0,4).join(' '),420);return normalizeModule({id,title,summary,content})}).slice(0,30)}
    function splitModules(text){const raw=String(text||'');let marks=markerMatches(raw);if(marks.length<25)marks=headingMatches(raw);if(marks.length<25)throw new Error(`Encontrei apenas ${marks.length} marcadores de módulo no JSON.`);return splitByMarks(raw,marks)}
    function moduleCard(module){return`<article class="module" id="modulo-${module.id}"><div class="module-number">Módulo ${String(module.id).padStart(2,'0')}</div><h2>${escapeHtml(module.title)}</h2><p class="summary">${escapeHtml(module.summary||'Conteúdo completo extraído do PDF enviado.')}</p><details open><summary>Conteúdo completo do módulo (${module.charCount.toLocaleString('pt-BR')} caracteres)</summary><div class="content-text">${escapeHtml(module.content)}</div></details>${module.images?`<details><summary>Sugestões de imagens do módulo</summary><div class="image-prompts">${escapeHtml(module.images)}</div></details>`:''}</article>`}
    function navItem(module){return`<a href="#modulo-${module.id}">${String(module.id).padStart(2,'0')} — ${escapeHtml(module.title)}</a>`}
    function render(list=modules){root.innerHTML=list.map(moduleCard).join('');nav.innerHTML=list.map(navItem).join('');count.textContent=`${list.length} módulo${list.length===1?'':'s'}`;statusBox.textContent=list.length?'Conteúdo completo carregado.':'Nenhum módulo encontrado para a busca.'}
    function filterModules(){const query=search.value.trim().toLowerCase();render(modules.filter(module=>(module.title+' '+module.summary+' '+module.content+' '+module.images).toLowerCase().includes(query)))}
    async function loadCourse(){try{const dataResponse=await fetch('/data/curso-extraido.json',{cache:'no-store'});if(dataResponse.ok){const data=await dataResponse.json();modules=splitModules(data.texto||data.text||'');heroDesc.textContent=`Conteúdo real carregado: ${modules.length} módulos, ${data.paginas||160} páginas e ${(data.totalCaracteres||data.texto?.length||0).toLocaleString('pt-BR')} caracteres.`;return render(modules)}throw new Error('JSON estático indisponível')}catch(firstError){try{const indexResponse=await fetch('/api/course/index',{cache:'no-store'});if(!indexResponse.ok)throw new Error('Não consegui abrir /api/course/index');const indexData=await indexResponse.json();const list=(indexData.modules||[]).slice(0,30);const details=await Promise.all(list.map(async item=>{const response=await fetch(`/api/course/module?id=${item.id}`,{cache:'no-store'});if(!response.ok)throw new Error(`Falha ao abrir módulo ${item.id}`);return normalizeModule(await response.json())}));modules=details.sort((a,b)=>a.id-b.id);if(modules.some(m=>/Conteúdo real ainda não carregado/i.test(m.content)))throw new Error('API retornou fallback, não o curso real.');heroDesc.textContent=`Conteúdo carregado via API: ${modules.length} módulos.`;render(modules)}catch(error){statusBox.textContent='Erro ao carregar curso: '+error.message;root.innerHTML='<article class="module"><h2>Erro ao carregar o conteúdo</h2><p>'+escapeHtml(error.message)+'</p></article>'}}}
    search.addEventListener('input',filterModules);loadCourse();
  </script>
</body>
</html>
