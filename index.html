<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>O Código da Agulha — Curso de Bordado</title>
  <meta name="description" content="Curso de bordado com módulos organizados para estudo, prática e impressão.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <span class="badge">Curso pronto</span>
      <h1>O Código da Agulha</h1>
      <p>
        Curso de bordado com módulos consolidados. Este site apresenta o conteúdo pronto
        para estudo, prática e impressão, com navegação simples e carregamento seguro.
      </p>
      <div class="actions">
        <button type="button" onclick="window.print()">Imprimir / salvar PDF</button>
        <a href="#modulos">Ver módulos</a>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <input id="search" placeholder="Pesquisar módulo, aula ou técnica" aria-label="Pesquisar módulo">
      <div id="count" class="count">Carregando...</div>
      <nav id="nav" aria-label="Lista de módulos"></nav>
    </aside>

    <section id="modulos" class="content">
      <div id="status" class="status">Carregando módulos...</div>
      <div id="modules"></div>
    </section>
  </main>

  <footer>
    <p>O Código da Agulha — curso pronto de bordado.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
